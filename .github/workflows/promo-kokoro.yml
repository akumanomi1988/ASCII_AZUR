name: ASCII AZUR premium Kokoro narrator
on:
  push:
    branches:
      - media/gameplay-trailer-20261107
    paths:
      - tools/promo-kokoro.py
      - .github/workflows/promo-kokoro.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spanish-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the game's real authored soundtrack
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm run score:master
      - name: Install Kokoro ONNX runtime and Spanish phonemizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libespeak-ng1
          python -m pip install --disable-pip-version-check "kokoro-onnx==0.6.1" "misaki-fork[en]" soundfile
      - name: Download reusable open Kokoro FP16 model and Spanish voices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/kokoro
          curl --fail --location --retry 4 --retry-delay 3 --silent --show-error \
            --output .cache/kokoro/kokoro-v1.0.fp16.onnx \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl --fail --location --retry 4 --retry-delay 3 --silent --show-error \
            --output .cache/kokoro/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s .cache/kokoro/kokoro-v1.0.fp16.onnx)" -gt 100000000
          test "$(stat -c%s .cache/kokoro/voices-v1.0.bin)" -gt 10000000
      - name: Synthesize and master the Spanish voiceover
        env:
          AZUR_KOKORO_VOICE: em_alex
        run: python tools/promo-kokoro.py
      - name: Retain unmixed voice, music mix, and voice-sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azur-kokoro-narration-spanish
          path: artifacts/promo-kokoro/*
          retention-days: 30
          if-no-files-found: warn
