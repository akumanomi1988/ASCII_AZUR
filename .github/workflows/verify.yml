name: ASCII AZUR quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ascii-azur-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact TypeScript dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile and test source and offline dependencies
        run: npm run verify
      - name: Retain ten complete original mastered scene reference tracks
        uses: actions/upload-artifact@v4
        with:
          name: ascii-azur-original-mastered-score
          path: artifacts/score-master/*
          retention-days: 30
          if-no-files-found: error
      - name: Bundle standalone playable game
        run: python3 tools/build-standalone.py
      - name: Package release assets
        run: python3 tools/create-release.py
      - name: Attach playable build and sources
        uses: actions/upload-artifact@v4
        with:
          name: ascii-azur-build
          path: release/*
          retention-days: 14
      - name: Store verified GitHub Pages distribution
        uses: actions/upload-artifact@v4
        with:
          name: ascii-azur-pages
          path: |
            index.html
            style.css
            sw.js
            manifest.webmanifest
            assets/icon.svg
            dist/**
          retention-days: 3

  browser:
    name: Browser and turn-menu acceptance
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact source for browser acceptance
        run: npm install --ignore-scripts --no-audit --no-fund && npm run build
      - name: Browser integration acceptance — both modes and backends
        run: python3 tools/browser-acceptance.py
      - name: Mobile viewport and synthetic touch acceptance
        run: python3 tools/mobile-acceptance.py
      - name: Exercise production smoke harness against built local game
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          AZUR_SMOKE_ROOT: http://127.0.0.1:18977/
        run: |
          set -euo pipefail
          python3 -c 'import json,os; from pathlib import Path; from datetime import datetime,timezone; Path("build-info.json").write_text(json.dumps({"source_commit":os.environ["SOURCE_SHA"],"build":"verified-github-actions","published_at":datetime.now(timezone.utc).isoformat()}))'
          python3 -m http.server 18977 --bind 127.0.0.1 >/tmp/azur-smoke-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -f build-info.json' EXIT
          node tools/public-release-smoke.mjs
      - name: Retain local public-smoke acceptance screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascii-azur-local-public-smoke
          path: artifacts/public-smoke/*
          retention-days: 14
          if-no-files-found: warn
      - name: Retain mobile acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascii-azur-mobile-viewport-evidence
          path: artifacts/mobile-acceptance/*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Retain browser-rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascii-azur-renderer-evidence
          path: artifacts/browser-acceptance/*.png
          retention-days: 14
          if-no-files-found: warn

  android-emulator:
    name: Android emulator API ${{ matrix.api-level }} / native Chrome
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production JS for actual Android Chrome
        run: npm install --ignore-scripts --no-audit --no-fund && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Stage exact game JS and compile offline Android APK
        run: |
          python3 tools/stage-android-assets.py
          gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo 'No KVM on this runner; emulator runner will select software fallback'; fi
      - name: Run real Android Chrome through ADB and DevTools
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          script: ANDROID_API_LEVEL=${{ matrix.api-level }} node tools/android-native-acceptance.mjs && ANDROID_API_LEVEL=${{ matrix.api-level }} node tools/android-emulator-acceptance.mjs
      - name: Retain Android device screenshots, audio, memory and frame-time evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascii-azur-android-api-${{ matrix.api-level }}-evidence
          path: |
            artifacts/android-emulator/${{ matrix.api-level }}/*
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 21
          if-no-files-found: warn

  publish-pages:
    name: Publish validated game
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser, android-emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ascii-azur-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ascii-azur-pages
          path: pages-build
      - name: Publish verified static build to gh-pages without force push
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          pages="$RUNNER_TEMP/ascii-azur-pages"
          git worktree add --detach "$pages" origin/gh-pages
          rm -rf "$pages/dist" "$pages/assets"
          cp -R pages-build/dist "$pages/dist"
          mkdir -p "$pages/assets"
          cp -R pages-build/assets/. "$pages/assets/"
          cp pages-build/index.html pages-build/style.css pages-build/sw.js pages-build/manifest.webmanifest "$pages/"
          touch "$pages/.nojekyll"
          python3 - "$pages/build-info.json" <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              "source_commit": os.environ["SOURCE_SHA"],
              "build": "verified-github-actions",
              "published_at": datetime.now(timezone.utc).isoformat()
          }, indent=2) + "\n")
          PY
          git -C "$pages" config user.name "github-actions[bot]"
          git -C "$pages" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$pages" add -A
          if ! git -C "$pages" diff --cached --quiet; then
            git -C "$pages" commit -m "deploy: ASCII AZUR verified $SOURCE_SHA"
            git -C "$pages" push origin HEAD:gh-pages
          fi

  public-smoke:
    name: Verify actual public Pages game (desktop/mobile)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify served source, assets, new game and persisted continue in real Chromium
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node tools/public-release-smoke.mjs
      - name: Keep screenshots and live provenance report on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azur-public-release-evidence
          path: artifacts/public-smoke/*
          retention-days: 30
          if-no-files-found: error
