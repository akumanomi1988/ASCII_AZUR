name: ASCII AZUR quality gates
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact TypeScript dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compile and test source and offline dependencies
        run: npm run verify
      - name: Bundle standalone playable game
        run: python3 tools/build-standalone.py
      - name: Package release assets
        run: python3 tools/create-release.py
      - name: Attach playable build and sources
        uses: actions/upload-artifact@v4
        with:
          name: ascii-azur-build
          path: release/*
          retention-days: 14
